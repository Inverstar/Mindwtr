name: Build mindwtr-merged (Olares)

# 把上游两个官方镜像（mindwtr-cloud + mindwtr-app）和 npm 上的 MCP helper
# 拼成一个三合一镜像，供 Olares 上的 Mindwtr 应用使用。
#
# 本仓库只做「拼装」，不编译源码：
#   - 上游发版并推好 mindwtr-cloud / mindwtr-app 之后，这里跟着打一个合并镜像
#   - 镜像名固定为 ghcr.io/<owner>/mindwtr-merged，<owner> 是本仓库的账号名，
#     所以从 Inverstar/apps 搬到本仓库后，chart 里的 repository 不需要改
#
# 触发方式：**只有手动**（workflow_dispatch）。
# 上游发新版 → 你在这里点一次 / 跑一条命令 → 出镜像 → 再去 Inverstar/apps 提 chart 的 PR。
# 不做 push/schedule 自动触发，理由：Olares 那边的 chart 本来就要手动提 PR，
# 镜像先于 chart 自动构建出来没有任何收益，反而多出一堆无人处理的 run。
#
# 关于「默认分支」的官方规则（docs.github.com/actions/reference/workflows-and-actions/
# events-that-trigger-workflows）：
#   - workflow_dispatch：「This event will only trigger a workflow run if the workflow
#     file exists on the default branch.」——文件不在默认分支时它不会被注册，
#     第一次 dispatch 会 404（实测过）。
#   - 「Once a workflow has run at least once, you can dispatch it against any branch
#     or tag via the GitHub API or GitHub CLI.」——只要跑过一次，之后用 CLI/API
#     可以对任意分支 dispatch，文件不在默认分支也没关系（也已实测）。
#
# 本仓的约定：**main 保持与上游 dongdongbh/Mindwtr 完全一致**，不放任何本仓改动；
# 构建文件只活在 olares-app 分支上。所以手动触发必须带 ref：
#
#   gh workflow run olares-image.yml --ref olares-app
#
# 万一哪天 dispatch 报 404（workflow 记录被清掉），临时恢复办法：把下面这段
# push 触发器加回来，往 olares-app 推一次任意改动让它跑起来完成注册，再删掉。
#
#   # push:
#   #   branches: [olares-app]
#   #   paths: ['olares/**']

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: '上游版本号（留空 = 自动取 dongdongbh/Mindwtr 最新 release）'
        required: false
        default: ''
      mcp_version:
        description: 'mindwtr-mcp 版本（留空 = 自动取 npm 上 latest）'
        required: false
        default: ''
      tag_suffix:
        description: '镜像 tag 后缀（留空 = 直接用版本号；需要重建同版本时填 r2/r3）'
        required: false
        default: ''
      force:
        description: '强制重建（忽略「该 tag 已存在」的跳过判断）'
        required: false
        type: boolean
        default: false

# 同一时间只允许一个构建；手动触发的排在新任务后面，不取消正在跑的
concurrency:
  group: olares-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # 版本来源仓库（上游）。fork 里跑也取上游的版本号，因为镜像内容全部来自上游镜像。
  UPSTREAM_REPO: dongdongbh/Mindwtr
  IMAGE_NAME: mindwtr-merged
  DEFAULT_MCP_VERSION: '1.1.13'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve versions
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.upstream_version }}
          INPUT_MCP: ${{ github.event.inputs.mcp_version }}
          INPUT_SUFFIX: ${{ github.event.inputs.tag_suffix }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          # --- 上游版本号 -------------------------------------------------------
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
            echo "自动取到上游最新版本：$VERSION"
          fi
          # release tag 形如 v1.3.7，镜像 tag 用 1.3.7
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::版本号格式不对：$VERSION（期望 1.3.7 或 v1.3.7）"
            exit 1
          fi

          # --- MCP 版本 ---------------------------------------------------------
          # 留空就去 npm 查 latest，保证每次构建都用最新发布的 mindwtr-mcp；
          # 查不到时回退到下面的固定值，避免因为 registry 抖动直接构建失败。
          MCP="${INPUT_MCP:-}"
          if [ -z "$MCP" ]; then
            MCP="$(curl -fsSL --max-time 20 https://registry.npmjs.org/mindwtr-mcp/latest \
                   | jq -r '.version // empty')" || MCP=""
            if [ -n "$MCP" ]; then
              echo "自动取到 npm 最新 mindwtr-mcp：$MCP"
            else
              MCP="$DEFAULT_MCP_VERSION"
              echo "::warning::查询 npm 失败，回退到 mindwtr-mcp@${MCP}"
            fi
          fi

          # 指定版本时校验它在 npm 上确实存在，省掉 8 分钟后 npm install 才报错
          if ! curl -fsSL --max-time 20 -o /dev/null "https://registry.npmjs.org/mindwtr-mcp/${MCP}"; then
            echo "::error::npm 上不存在 mindwtr-mcp@${MCP}"
            exit 1
          fi

          # --- 目标 tag ---------------------------------------------------------
          SUFFIX="${INPUT_SUFFIX:-}"
          if [ -n "$SUFFIX" ]; then
            TAG="${VERSION}-${SUFFIX}"
          else
            TAG="$VERSION"
          fi

          # Docker 仓库名必须全小写，github.repository_owner 会保留 Inverstar 的大小写
          OWNER="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mcp=$MCP"         >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"     >> "$GITHUB_OUTPUT"

          # --- 上游镜像是否已就绪 ----------------------------------------------
          # 上游发版后 GHCR 上可能还没推完，直接构建会在 FROM 阶段失败。
          for suffix in mindwtr-cloud mindwtr-app; do
            REF="ghcr.io/dongdongbh/${suffix}:${VERSION}"
            if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
              echo "上游镜像就绪：$REF"
            else
              echo "::error::上游镜像尚未发布：$REF（等上游 workflow 跑完再重试）"
              exit 1
            fi
          done

          # --- 目标 tag 是否已存在 ----------------------------------------------
          if [ "${INPUT_FORCE:-false}" = "true" ]; then
            echo "force=true，忽略已存在的 tag，强制重建。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "${IMAGE}:${TAG} 已存在，跳过构建。需要重建请勾选 force。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "${IMAGE}:${TAG} 不存在，开始构建。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.vars.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: olares
          file: olares/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 始终重新解析基础镜像，避免命中本地/缓存里的旧层
          pull: true
          build-args: |
            CLOUD_IMAGE=ghcr.io/dongdongbh/mindwtr-cloud:${{ steps.vars.outputs.version }}
            APP_IMAGE=ghcr.io/dongdongbh/mindwtr-app:${{ steps.vars.outputs.version }}
            MCP_VERSION=${{ steps.vars.outputs.mcp }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.description=Mindwtr merged image (Cloud + MCP helper + PWA) for Olares
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 失败时的排查提示
        if: failure()
        run: |
          echo "::error::构建或推送失败，先看上方日志里的 ERROR 行。"
          echo "如果出现 'permission_denied: write_package'，说明 GHCR 包没有给本仓库写权限——"
          echo "包是由 Inverstar/apps 创建的，GITHUB_TOKEN 只能写「已授权给当前仓库」的包。"
          echo "修复：打开 https://github.com/users/${{ github.repository_owner }}/packages/container/${{ env.IMAGE_NAME }}/settings"
          echo "      → Manage Actions access → Add repository → ${{ github.repository }} → 角色选 Write → Add"

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SKIPPED: ${{ steps.vars.outputs.skip }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            HEAD="⏭ 跳过（tag 已存在）"
          elif [ "$JOB_STATUS" = "success" ]; then
            HEAD="✅ 构建并推送完成"
          else
            HEAD="❌ 失败（见上方日志）"
          fi
          {
            echo "### ${HEAD}"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\` |"
            echo "| 上游版本 | \`${{ steps.vars.outputs.version }}\` |"
            echo "| MCP 版本 | \`${{ steps.vars.outputs.mcp }}\` |"
            echo "| 架构 | linux/amd64, linux/arm64 |"
            echo ""
            echo "> 记得把 Inverstar/apps 里 \`mindwtr/values.yaml\` 的 \`image.tag\` 改成上面的 tag，"
            echo "> 并把 \`Chart.yaml\` 的 version 加一位，再提 PR。"
          } >> "$GITHUB_STEP_SUMMARY"
